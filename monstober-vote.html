<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>MonsTober Live Vote — CanvasWars</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --ink:#14120f;
  --panel:#201c17;
  --panel-hi:#28221b;
  --paper:#f2ede4;
  --paper-dim:#c9c2b4;
  --pink:#ff3d7f;
  --orange:#ff6b1a;
  --gold:#c9a227;
  --line:rgba(242,237,228,0.12);
  --radius:14px;
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(255,61,127,0.10), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(255,107,26,0.08), transparent 55%),
    var(--ink);
  color:var(--paper);
  font-family:'Work Sans', system-ui, sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{ max-width:620px; margin:0 auto; padding:28px 18px 80px; }

/* header */
.eyebrow{
  font-family:'JetBrains Mono', monospace;
  font-size:12px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--pink);
  display:flex; align-items:center; gap:8px;
  margin-bottom:6px;
}
.dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--pink);
  box-shadow:0 0 0 0 rgba(255,61,127,0.6);
  animation:pulse 1.8s infinite;
}
@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(255,61,127,0.55); }
  70%{ box-shadow:0 0 0 9px rgba(255,61,127,0); }
  100%{ box-shadow:0 0 0 0 rgba(255,61,127,0); }
}
h1{
  font-family:'Anton', sans-serif;
  font-weight:400;
  font-size:clamp(40px, 12vw, 62px);
  line-height:0.92;
  letter-spacing:0.01em;
  margin:0 0 10px;
  text-transform:uppercase;
  background:linear-gradient(180deg, var(--paper) 0%, var(--paper) 55%, var(--paper-dim) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
h1 span{ color:var(--orange); -webkit-text-fill-color:var(--orange); }
.meta{
  font-size:14px;
  color:var(--paper-dim);
  margin-bottom:22px;
}
.meta b{ color:var(--paper); font-weight:600; }

/* leaderboard list */
.board{ display:flex; flex-direction:column; gap:12px; margin-top:8px; }

.card{
  position:relative;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 16px 16px 14px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:14px;
  overflow:hidden;
  transition:border-color 0.2s ease, transform 0.15s ease;
}
.card.leading{
  border-color:rgba(255,107,26,0.45);
  background:var(--panel-hi);
}
.card.leading::before{
  content:"";
  position:absolute;
  inset:-40% -20% auto auto;
  width:220px; height:220px;
  background:radial-gradient(circle, rgba(255,107,26,0.30), rgba(255,61,127,0.14) 45%, transparent 70%);
  filter:blur(6px);
  animation:drift 6s ease-in-out infinite;
  pointer-events:none;
}
@keyframes drift{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(-8px,10px) scale(1.06); }
}

.rank{
  font-family:'JetBrains Mono', monospace;
  font-weight:700;
  font-size:15px;
  width:34px; height:34px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:var(--ink);
  background:var(--paper-dim);
  flex-shrink:0;
  position:relative;
  z-index:1;
}
.rank.top1{ background:var(--gold); box-shadow:0 0 0 3px rgba(201,162,39,0.18); }
.rank.top2{ background:#d8d2c4; }
.rank.top3{ background:#a9967a; }
.rank.top1::after, .rank.top2::after, .rank.top3::after{
  content:"";
  position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
  width:3px; height:8px; background:inherit; border-radius:0 0 3px 3px;
}

.info{ min-width:0; position:relative; z-index:1; }
.name{
  font-weight:700; font-size:16px; line-height:1.2;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.style{
  font-size:12.5px; color:var(--paper-dim);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  margin-top:2px;
}

.right{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; position:relative; z-index:1; }
.count{
  font-family:'JetBrains Mono', monospace;
  font-weight:700; font-size:20px;
  color:var(--paper);
  min-width:44px; text-align:right;
  font-variant-numeric:tabular-nums;
}
.count small{ font-size:10px; font-weight:500; color:var(--paper-dim); text-transform:uppercase; letter-spacing:0.08em; display:block; }

button.vote{
  font-family:'Work Sans', sans-serif;
  font-weight:700; font-size:12.5px; letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--ink);
  background:linear-gradient(135deg, var(--pink), var(--orange));
  border:none; border-radius:9px;
  padding:9px 16px;
  cursor:pointer;
  transition:transform 0.1s ease, opacity 0.15s ease;
}
button.vote:active{ transform:scale(0.94); }
button.vote:disabled{
  background:transparent;
  border:1px solid var(--line);
  color:var(--paper-dim);
  cursor:default;
}
button.vote:focus-visible{ outline:2px solid var(--paper); outline-offset:2px; }

.empty{
  text-align:center; padding:50px 20px;
  color:var(--paper-dim); font-size:14px;
  border:1px dashed var(--line); border-radius:var(--radius);
}

/* sponsors */
.sponsors{
  margin-top:36px;
  padding-top:18px;
  border-top:1px solid var(--line);
  text-align:center;
}
.sponsors .label{
  font-family:'JetBrains Mono', monospace;
  font-size:10px; letter-spacing:0.16em; text-transform:uppercase;
  color:var(--paper-dim); margin-bottom:10px;
}
.sponsors .names{
  font-size:12.5px; color:var(--paper-dim);
  line-height:1.8;
}

/* crew / admin */
.crew-link{
  display:block; text-align:center;
  margin-top:26px;
  font-family:'JetBrains Mono', monospace;
  font-size:11px; letter-spacing:0.08em;
  color:rgba(242,237,228,0.28);
  background:none; border:none; cursor:pointer;
  padding:8px;
}
.panel{
  margin-top:14px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  display:none;
}
.panel.open{ display:block; }
.panel h2{
  font-family:'Anton', sans-serif; font-weight:400; font-size:18px;
  text-transform:uppercase; letter-spacing:0.02em; margin:0 0 12px;
  color:var(--orange);
}
.panel label{
  display:block; font-size:11px; color:var(--paper-dim);
  text-transform:uppercase; letter-spacing:0.06em; margin:10px 0 4px;
}
.panel input{
  width:100%; background:var(--ink); border:1px solid var(--line);
  border-radius:8px; padding:9px 10px; color:var(--paper);
  font-family:'Work Sans', sans-serif; font-size:14px;
}
.panel input:focus{ outline:1px solid var(--gold); }
.row-btns{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.panel button{
  font-family:'Work Sans', sans-serif; font-weight:600; font-size:13px;
  border-radius:8px; padding:9px 14px; cursor:pointer; border:1px solid var(--line);
  background:transparent; color:var(--paper);
}
.panel button.primary{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
.panel button.danger{ color:var(--pink); border-color:rgba(255,61,127,0.4); }
.roster-item{
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;
}
.roster-item:last-child{ border-bottom:none; }
.roster-item button{ padding:4px 10px; font-size:11px; }
.status{ font-size:12px; color:var(--paper-dim); margin-top:10px; min-height:16px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow"><span class="dot"></span> CANVASWARS · LIVE</div>
  <h1>Mons<span>tober</span></h1>
  <div class="meta"><b>Oct 3, 2026</b> · Phoenix Phoodery, Medford — vote for your favorite live piece</div>

  <div id="board" class="board">
    <div class="empty">Loading the board…</div>
  </div>

  <div class="sponsors">
    <div class="label">Backed by</div>
    <div class="names">LifeArt · Oh's Osaka · Blick · Rosemary &amp; Co · PPG</div>
  </div>

  <button class="crew-link" id="crewToggle">event crew</button>
  <div class="panel" id="panel">
    <h2>Crew Panel</h2>

    <label for="aName">Add artist — name</label>
    <input id="aName" type="text" placeholder="e.g. Miles">
    <label for="aStyle">Style / medium (optional)</label>
    <input id="aStyle" type="text" placeholder="e.g. Spray + stencil">
    <div class="row-btns">
      <button class="primary" id="addArtist">Add artist</button>
    </div>

    <label style="margin-top:18px;">Current roster</label>
    <div id="roster"></div>

    <div class="row-btns">
      <button class="danger" id="resetVotes">Reset all votes</button>
    </div>
    <div class="status" id="status"></div>
  </div>

</div>

<script>
(function(){
  const board = document.getElementById('board');
  const roster = document.getElementById('roster');
  const statusEl = document.getElementById('status');
  const panel = document.getElementById('panel');
  const crewToggle = document.getElementById('crewToggle');

  crewToggle.addEventListener('click', () => panel.classList.toggle('open'));

  function setStatus(msg){
    statusEl.textContent = msg || '';
    if(msg){ setTimeout(() => { if(statusEl.textContent===msg) statusEl.textContent=''; }, 2500); }
  }

  function uid(){ return 'a' + Math.random().toString(36).slice(2,9); }

  async function getArtists(){
    try{
      const r = await window.storage.get('artists', true);
      return r ? JSON.parse(r.value) : [];
    }catch(e){ return []; }
  }
  async function setArtists(list){
    try{ await window.storage.set('artists', JSON.stringify(list), true); }
    catch(e){ setStatus('Could not save roster.'); }
  }
  async function getVotes(){
    try{
      const r = await window.storage.get('votes', true);
      return r ? JSON.parse(r.value) : {};
    }catch(e){ return {}; }
  }
  async function setVotes(v){
    try{ await window.storage.set('votes', JSON.stringify(v), true); }
    catch(e){ setStatus('Could not save votes.'); }
  }
  async function hasVoted(id){
    try{
      const r = await window.storage.get('voted_'+id, false);
      return !!r;
    }catch(e){ return false; }
  }
  async function markVoted(id){
    try{ await window.storage.set('voted_'+id, '1', false); }catch(e){}
  }

  async function render(){
    const [artists, votes] = await Promise.all([getArtists(), getVotes()]);

    if(!artists.length){
      board.innerHTML = '<div class="empty">No artists on the board yet — add them from the crew panel.</div>';
      renderRoster([]);
      return;
    }

    const withVotes = artists.map(a => ({ ...a, count: votes[a.id] || 0 }));
    withVotes.sort((a,b) => b.count - a.count);

    const cards = await Promise.all(withVotes.map(async (a, idx) => {
      const voted = await hasVoted(a.id);
      const rankClass = idx===0 ? 'top1' : idx===1 ? 'top2' : idx===2 ? 'top3' : '';
      const leading = idx===0 && a.count>0 ? 'leading' : '';
      return `
        <div class="card ${leading}" data-id="${a.id}">
          <div class="rank ${rankClass}">${idx+1}</div>
          <div class="info">
            <div class="name">${escapeHtml(a.name)}</div>
            <div class="style">${escapeHtml(a.style || '')}</div>
          </div>
          <div class="right">
            <div class="count">${a.count}<small>votes</small></div>
            <button class="vote" data-id="${a.id}" ${voted ? 'disabled' : ''}>${voted ? 'Voted' : 'Vote'}</button>
          </div>
        </div>`;
    }));

    board.innerHTML = cards.join('');
    board.querySelectorAll('button.vote:not(:disabled)').forEach(btn=>{
      btn.addEventListener('click', () => castVote(btn.dataset.id));
    });

    renderRoster(artists);
  }

  function renderRoster(artists){
    if(!artists.length){ roster.innerHTML = '<div class="status">No artists yet.</div>'; return; }
    roster.innerHTML = artists.map(a => `
      <div class="roster-item">
        <span>${escapeHtml(a.name)}${a.style ? ' — '+escapeHtml(a.style) : ''}</span>
        <button data-remove="${a.id}">Remove</button>
      </div>`).join('');
    roster.querySelectorAll('button[data-remove]').forEach(btn=>{
      btn.addEventListener('click', () => removeArtist(btn.dataset.remove));
    });
  }

  async function castVote(id){
    const voted = await hasVoted(id);
    if(voted) return;
    const votes = await getVotes();
    votes[id] = (votes[id] || 0) + 1;
    await setVotes(votes);
    await markVoted(id);
    render();
  }

  document.getElementById('addArtist').addEventListener('click', async () => {
    const nameInput = document.getElementById('aName');
    const styleInput = document.getElementById('aStyle');
    const name = nameInput.value.trim();
    if(!name){ setStatus('Enter a name first.'); return; }
    const artists = await getArtists();
    artists.push({ id: uid(), name, style: styleInput.value.trim() });
    await setArtists(artists);
    nameInput.value = ''; styleInput.value = '';
    setStatus('Artist added.');
    render();
  });

  async function removeArtist(id){
    let artists = await getArtists();
    artists = artists.filter(a => a.id !== id);
    await setArtists(artists);
    const votes = await getVotes();
    delete votes[id];
    await setVotes(votes);
    setStatus('Artist removed.');
    render();
  }

  document.getElementById('resetVotes').addEventListener('click', async () => {
    if(!confirm('Reset all vote counts to zero? This cannot be undone.')) return;
    await setVotes({});
    setStatus('Votes reset.');
    render();
  });

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  render();
  setInterval(render, 5000);
})();
</script>
</body>
</html>
